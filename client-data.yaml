INSTRUCTOR_1_TITLE: "Owner & Head Instructor · 4th Degree BJJ Black Belt"
INSTRUCTOR_1_BIO: "Yanni Hronakis holds a 4th Degree Black Belt in Brazilian Jiu-Jitsu under Jamie Cruz — one of the first American Black Belts under Renzo Gracie — and a 4th Degree Black Belt in Taekwondo, with additional training in Muay Thai Kickboxing. He began martial arts at age 8, started assisting classes at 16, and has been competing alongside his students ever since, regularly appearing on tournament podiums across New Jersey and beyond. You'll find him on the mats every single day, whether coaching, drilling, or rolling with students of all ages and levels."

