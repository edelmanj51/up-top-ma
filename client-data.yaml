# ── About section ─────────────────────────────────────────────────────────────
ABOUT_TEXT: "Up Top Martial Arts Academy is Wayne, NJ's premier center for Brazilian Jiu-Jitsu and submission grappling, with programs for ages 4 through adult in a welcoming, community-driven environment. Head instructor Yanni Hronakis — a 4th Degree Black Belt through the Renzo Gracie lineage — trains alongside his students seven days a week, competing at every level to push both himself and his team to new heights."

# ── Instructor 1 (required) ───────────────────────────────────────────────────
