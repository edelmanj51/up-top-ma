REVIEWER_1_NAME: "Effie Haralambidis"
REVIEWER_1_DATE: "3 months ago"
REVIEWER_1_TEXT: "I highly recommend UT for kids Jiu Jitsu. My son is a very shy 4 year old and I was very surprised when we walked in, met the owner, tried a class and was told by my son that he enjoyed it very much. My son is very happy when I say it's \"Jiu Jitsu day\". Yanni is very patient, knowledgeable, great with the kids and commands the room with great control."

REVIEWER_2_NAME: "Maria Garo"
REVIEWER_2_DATE: "3 months ago"
REVIEWER_2_TEXT: "We love Up Top Martial Arts Academy! My six year old has been attending for two years and continues to learn discipline, build confidence and practice the art of BJJ. Yanni is an exceptional teacher who is patient yet firm when necessary. My son loves going!"

REVIEWER_3_NAME: "Jordan"
REVIEWER_3_DATE: "3 months ago"
REVIEWER_3_TEXT: "One of the best JiuJitsu schools in the area. Yanni has made a great community and is a great instructor. His students are welcoming and talented. I'd recommend for anyone trying martial arts."

REVIEWER_4_NAME: "Jeff Wells II"
REVIEWER_4_DATE: "3 months ago"
REVIEWER_4_TEXT: "Yanni is an excellent instructor, and the training partners are incredibly helpful, which makes the entire experience much easier. Great place to train."

REVIEWER_5_NAME: "Michael Gerne"
REVIEWER_5_DATE: "2 years ago"
REVIEWER_5_TEXT: "I got into BJJ late in life at 45. Time and time again I was told by instructors and students about Yanni's technical expertise. It's a great place with a great group of men and women to train with. I've been there for over 2 years now and love it. Great workout and even better stress reliever. No contract lock down — when you have a great product, you don't need to force a contract on someone."

